{% extends "base.html" %}
{% block title %}Login - FinLend{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow finlend-card">
            <div class="card-body p-4">
                <h3 class="mb-3 text-center">Welcome Back</h3>
                <p class="text-muted text-center">Login to manage your loans.</p>

                <form method="POST" novalidate>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" required>
                    </div>
                    <button class="btn btn-finlend w-100" type="submit">Login</button>
                </form>

                <p class="mt-3 mb-0 text-center">
                    New user? <a href="{{ url_for('register') }}">Create account</a>
                </p>
                <p class="text-center mt-2 mb-0">
                    <a href="{{ url_for('admin_login') }}" class="small">Admin Login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
