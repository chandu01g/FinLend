{% extends "base.html" %}
{% block title %}Admin Login - FinLend{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow finlend-card">
            <div class="card-body p-4">
                <h3 class="mb-3 text-center">Admin Login</h3>
                <p class="text-muted text-center">Manage users and loan approvals.</p>

                <form method="POST" novalidate>
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" required>
                    </div>
                    <button class="btn btn-dark w-100" type="submit">Login as Admin</button>
                </form>

                <p class="mt-3 mb-0 text-center">
                    <a href="{{ url_for('login') }}" class="small">Back to user login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
