{% extends "base.html" %}
{% block title %}Register - FinLend{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow finlend-card">
            <div class="card-body p-4">
                <h3 class="mb-3 text-center">Create Your FinLend Account</h3>

                <form method="POST" id="register-form" novalidate>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" name="full_name" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="email" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Phone</label>
                            <input type="text" class="form-control" name="phone" id="register-phone" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Address</label>
                            <input type="text" class="form-control" name="address" required>
                        </div>

                        <div class="col-12">
                            <div class="otp-box p-3">
                                <div class="row g-2 align-items-end">
                                    <div class="col-md-4">
                                        <label class="form-label">Phone OTP</label>
                                        <input
                                            type="text"
                                            class="form-control"
                                            id="register-otp"
                                            maxlength="6"
                                            inputmode="numeric"
                                            pattern="\d{6}"
                                            autocomplete="one-time-code"
                                            placeholder="Enter 6-digit OTP"
                                        >
                                    </div>
                                    <div class="col-md-8 d-flex gap-2 flex-wrap">
                                        <button class="btn btn-outline-primary" id="send-otp-btn" type="button">Send OTP</button>
                                        <button class="btn btn-outline-success" id="verify-otp-btn" type="button">Verify OTP</button>
                                        <span class="small text-muted align-self-center">Supports SMS auto-fill on supported browsers (WebOTP).</span>
                                    </div>
                                </div>
                                <div class="result-box mt-2" id="otp-status">Verify your phone number before account creation.</div>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" name="password" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" name="confirm_password" required>
                        </div>
                    </div>

                    <button class="btn btn-finlend mt-4 w-100" type="submit">Register</button>
                </form>

                <p class="mt-3 mb-0 text-center">
                    Already have an account? <a href="{{ url_for('login') }}">Login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
